<div class="container-fluid py-4">
  <div class="row g-4">
    <!-- Admin Sidebar -->
    <div class="col-lg-3 col-xl-2">
      <div class="card shadow-sm border-0 bg-dark text-white p-3 rounded-4 sticky-top" style="top: 80px;">
        <div class="d-flex align-items-center mb-3 pb-3 border-bottom border-secondary">
          <i class="bi bi-shield-lock-fill text-warning fs-3 me-2"></i>
          <div>
            <div class="fw-bold font-serif">StayEase Admin</div>
            <div class="text-secondary small">Operations Center</div>
          </div>
        </div>

        <ul class="nav flex-column gap-1">
          <li class="nav-item">
            <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link text-light py-2 rounded">
              <i class="bi bi-speedometer2 me-2 text-warning"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/hotels" routerLinkActive="active" class="nav-link text-light py-2 rounded">
              <i class="bi bi-buildings me-2 text-primary"></i> Hotels
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/rooms" routerLinkActive="active" class="nav-link text-light py-2 rounded">
              <i class="bi bi-door-closed me-2 text-success"></i> Rooms & Cleaning
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/reservations" routerLinkActive="active" class="nav-link text-light py-2 rounded">
              <i class="bi bi-calendar-check me-2 text-info"></i> Reservations
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/reviews" routerLinkActive="active" class="nav-link text-light py-2 rounded">
              <i class="bi bi-chat-heart me-2 text-danger"></i> Review Moderation
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/audit" routerLinkActive="active" class="nav-link text-light py-2 rounded">
              <i class="bi bi-journal-text me-2 text-warning"></i> Audit Trails
            </a>
          </li>
          <li class="nav-item mt-3 pt-3 border-top border-secondary">
            <a routerLink="/" [queryParams]="{ guest: 'true' }" class="nav-link text-secondary py-2 rounded">
              <i class="bi bi-box-arrow-left me-2"></i> Guest Portal
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Admin Content Router Outlet -->
    <div class="col-lg-9 col-xl-10">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
