<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" style="background: linear-gradient(90deg, #0f172a 0%, #1e3a8a 100%) !important;">
  <div class="container py-2">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center fw-bold" routerLink="/">
      <i class="bi bi-buildings-fill text-warning me-2 fs-3"></i>
      <span class="fs-4 font-serif text-white tracking-wide">StayEase</span>
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#stayEaseNav" aria-controls="stayEaseNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Links -->
    <div class="collapse navbar-collapse" id="stayEaseNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
        <li class="nav-item">
          <a class="nav-link text-light" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light" routerLink="/hotels" routerLinkActive="active">
            <i class="bi bi-compass me-1"></i> Explore Hotels
          </a>
        </li>
        <li class="nav-item" *ngIf="authService.isLoggedIn()">
          <a class="nav-link text-light" routerLink="/reservations" routerLinkActive="active">
            <i class="bi bi-calendar-check me-1"></i> My Bookings
          </a>
        </li>
      </ul>

      <!-- User Actions & Auth -->
      <div class="d-flex align-items-center gap-2">
        <ng-container *ngIf="!currentUser">
          <a routerLink="/login" class="btn btn-outline-light btn-sm px-3 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </a>
          <a routerLink="/register" class="btn btn-warning btn-sm px-3 fw-semibold text-dark shadow-sm">
            <i class="bi bi-person-plus me-1"></i> Register
          </a>
        </ng-container>

        <ng-container *ngIf="currentUser">
          <!-- Admin badge/link if Admin -->
          <a *ngIf="currentUser.role === 'ROLE_ADMIN'" routerLink="/admin" class="btn btn-warning btn-sm fw-bold me-2 shadow-sm text-dark">
            <i class="bi bi-shield-lock-fill me-1"></i> Admin Portal
          </a>

          <!-- User dropdown -->
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center py-1 px-3 rounded-pill" type="button" id="userMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle fs-5 me-2 text-warning"></i>
              <span class="fw-semibold">{{ currentUser.fullName || currentUser.email }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 rounded-3" aria-labelledby="userMenuBtn">
              <li>
                <div class="dropdown-header text-muted small">Signed in as <strong>{{ currentUser.email }}</strong></div>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item py-2" routerLink="/profile">
                  <i class="bi bi-person-gear me-2 text-primary"></i> My Profile
                </a>
              </li>
              <li>
                <a class="dropdown-item py-2" routerLink="/reservations">
                  <i class="bi bi-receipt me-2 text-primary"></i> My Reservations
                </a>
              </li>
              <li *ngIf="currentUser.role === 'ROLE_ADMIN'"><hr class="dropdown-divider"></li>
              <li *ngIf="currentUser.role === 'ROLE_ADMIN'">
                <a class="dropdown-item py-2 text-warning fw-bold bg-dark rounded mx-2" routerLink="/admin">
                  <i class="bi bi-speedometer2 me-2"></i> Admin Dashboard
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item py-2 text-danger fw-semibold" (click)="onLogout()">
                  <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                </button>
              </li>
            </ul>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
