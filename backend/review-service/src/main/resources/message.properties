# Bean Validation Messages
NotNull.createReviewRequest.reservationId=Reservation ID is required
NotNull.createReviewRequest.rating=Rating is required
Min.createReviewRequest.rating=Rating must be between 1 and 5
Max.createReviewRequest.rating=Rating must be between 1 and 5
NotBlank.createReviewRequest.comment=Review comment is required
Size.createReviewRequest.comment=Review comment must be between 10 and 1000 characters
NotBlank.removeReviewRequest.reason=Removal reason is required
Size.removeReviewRequest.reason=Removal reason cannot exceed 255 characters

# Review Business Messages
review.not.found=Review not found
review.ineligible=Guest has not completed a verified stay at this property
review.duplicate=Guest has already reviewed this reservation
review.rating.invalid=Rating must be between 1 and 5
review.window.expired=Review submission window has expired (must be within 30 days of checkout)
review.not.checked.out=Reservation must be in CHECKED_OUT status to submit a review
review.not.owner=You can only review reservations that you booked
review.already.removed=Review is already removed
service.unavailable=Downstream service is currently unavailable
