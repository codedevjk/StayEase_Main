spring:
  application:
    name: stayease-review-service

  messages:
    basename: messages,message
    encoding: UTF-8

  datasource:
    url: ${STAYEASE_REVIEW_DB_URL:jdbc:mysql://localhost:3306/stayease_review_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${STAYEASE_REVIEW_DB_USER:root}
    password: ${STAYEASE_REVIEW_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ReviewServicePool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: stayease-review-service
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${server.port}

server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

stayease:
  jwt:
    secret: ${JWT_SECRET:c3RheWVhc2Utc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLXRlc3RpbmctcHVycG9zZXMtb25seQ==}
    expiration-seconds: 900
    issuer: stayease
  review:
    eligibility-window-days: 30
  internal:
    user-service-url: ${USER_SERVICE_URL:http://stayease-user-service}
    reservation-service-url: ${RESERVATION_SERVICE_URL:http://stayease-reservation-service}
  time-zone: Asia/Kolkata

logging:
  config: classpath:log4j2.properties
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [correlationId=%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.stayease: DEBUG
