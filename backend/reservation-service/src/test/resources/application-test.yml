spring:
  application:
    name: stayease-reservation-service-test

  messages:
    basename: messages,message
    encoding: UTF-8

  datasource:
    url: jdbc:h2:mem:stayease_reservation_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

server:
  port: -1

stayease:
  jwt:
    # 256-bit Base64-encoded test secret key
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11c2VyLXNlcnZpY2UtdGVzdHMtbXVzdC1iZS0yNTYtYml0cw==
    expiration-seconds: 900
    issuer: stayease
  pricing:
    tax-percentage: 12.00
  inventory:
    hold-duration-minutes: 10
    expiry-check-interval-seconds: 60
  time-zone: Asia/Kolkata
  check-in-time: "14:00:00"
  check-out-time: "11:00:00"
  security:
    verify-token-version-with-user-service: false

logging:
  config: classpath:log4j2.properties
  level:
    com.stayease: DEBUG
    org.springframework.security: WARN
