spring:
  application:
    name: stayease-user-service-test

  datasource:
    url: jdbc:h2:mem:stayease_user_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

server:
  port: -1

stayease:
  jwt:
    # 256-bit Base64-encoded test secret key
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11c2VyLXNlcnZpY2UtdGVzdHMtbXVzdC1iZS0yNTYtYml0cw==
    expiration-seconds: 900
    issuer: stayease
  admin-bootstrap:
    enabled: false
  time-zone: Asia/Kolkata

logging:
  level:
    com.stayease: DEBUG
    org.springframework.security: WARN
