spring:
  application:
    name: stayease-reservation-service

  datasource:
    url: ${STAYEASE_RESERVATION_DB_URL:jdbc:mysql://localhost:3306/stayease_reservation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${STAYEASE_RESERVATION_DB_USER:root}
    password: ${STAYEASE_RESERVATION_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ReservationServicePool
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: stayease-reservation-service
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${server.port}

server:
  port: 8083
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

stayease:
  jwt:
    secret: ${JWT_SECRET:c3RheWVhc2Utc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLXRlc3RpbmctcHVycG9zZXMtb25seQ==}
    expiration-seconds: 900
    issuer: stayease

  pricing:
    tax-percentage: 12.00

  inventory:
    hold-duration-minutes: 10
    expiry-check-interval-seconds: 60

  internal:
    user-service-url: lb://stayease-user-service
    property-service-url: lb://stayease-property-service

  time-zone: Asia/Kolkata
  check-in-time: "14:00:00"
  check-out-time: "11:00:00"

# ── Resilience4j circuit breakers ────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      property-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      property-service:
        timeoutDuration: 3s
      user-service:
        timeoutDuration: 2s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [correlationId=%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.stayease: DEBUG
